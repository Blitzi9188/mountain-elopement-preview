# Netlify build config for mountain-elopement.com
# The site is generated by build.py (pure stdlib Python — no dependencies).
# Netlify's build image ships Python 3, so it runs the generator on every push.
#
# Redirects live in _redirects (portable: Netlify + Cloudflare Pages), NOT here.
# Keep redirect rules in ONE place only to avoid conflicting rules.

[build]
  command = "python3 build.py"
  publish = "."
